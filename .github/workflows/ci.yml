name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Sites are written on Windows and built on Linux, so both have to pass.
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run the tests
        run: npm test

  site:
    name: Build a real site (${{ matrix.os }}, docmd ${{ matrix.docmd }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The oldest docmd the whole kit supports, and the newest in range.
        docmd: ['0.9.4', '^0.10.1']
    defaults:
      run:
        shell: bash
        working-directory: fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install docmd ${{ matrix.docmd }} and the kit
        run: |
          npm install
          npm install --no-save "@docmd/core@${{ matrix.docmd }}"
          node -p "'docmd ' + require('@docmd/core/package.json').version"
      - name: Build the fixture site with both checks
        run: npm run build
      - name: The built site holds both diagrams and loads the viewer only where needed
        run: |
          test "$(grep -o 'class="drawio-diagram"' site/index.html | wc -l)" -eq 1
          test "$(grep -o 'class="drawio-diagram"' site/guide/install/index.html | wc -l)" -eq 1
          test -f site/assets/js/drawio-viewer.min.js
          grep -q 'drawio-viewer.min.js' site/index.html
          if grep -q 'drawio-viewer.min.js' site/guide/index.html; then
            echo "the viewer is loaded on a page with no diagram"; exit 1
          fi
      # docmd exits 0 when a plugin throws. These two steps prove the kit's checks do not.
      - name: A broken diagram link must fail the build
        run: |
          cp docs/guide/index.md "$RUNNER_TEMP/index.md"
          printf '\n![Gone](/assets/gone.drawio)\n' >> docs/guide/index.md
          if npm run build; then echo "the build passed with a broken diagram link"; exit 1; fi
          cp "$RUNNER_TEMP/index.md" docs/guide/index.md
      - name: A stale page in the output must fail the nav check
        run: |
          npm run build
          mkdir -p site/stale && echo '<html></html>' > site/stale/index.html
          if npx docmd-kit check-nav; then echo "the nav check passed with an unlinked page"; exit 1; fi

  nav-only:
    # docmd 0.8 runs nav-gen but does not apply the drawio plugin's output, so only nav-gen is
    # supported there. This job keeps that promise honest.
    name: nav-gen on docmd 0.8.17
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install docmd 0.8.17 and the kit
        run: |
          npm install
          npm install --no-save "@docmd/core@0.8.17"
          node -p "'docmd ' + require('@docmd/core/package.json').version"
      - name: Build with nav-gen only and check the sidebar
        run: npm run build:nav-only
      - name: A stale page in the output must fail the nav check
        run: |
          mkdir -p site/stale && echo '<html></html>' > site/stale/index.html
          if npx docmd-kit check-nav --config docmd.nav-only.json; then echo "the nav check passed with an unlinked page"; exit 1; fi
